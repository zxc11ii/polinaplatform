name: Publish screen review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public review only
        run: |
          mkdir -p _review/screenshots
          cp review/index.html _review/index.html
          cp docs/screenshots/*.png _review/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _review
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
